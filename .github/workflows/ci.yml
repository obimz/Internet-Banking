name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Internet-Banking.slnx
      - name: Build
        run: dotnet build Internet-Banking.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Internet-Banking.slnx --no-build -c Release